# One non-production environment: either the persistent `dev` environment
# (develop branch) or an ephemeral `pr-<n>` preview. The same file serves both
# — only the ENV_* values differ, which is what keeps a preview a faithful
# rehearsal of dev rather than a different shape of deployment.
#
# Deployed as Portainer stack `hesbah-${ENV_ID}` (hesbah-dev, hesbah-pr-123, …).
# The stack name is not cosmetic: preview-router in nonprod-shared.yml derives
# the container name from the hostname (`pr-123.hesbah…` → `hesbah-pr-123-web-1`),
# so renaming the stack breaks routing.
#
# Postgres comes from the shared `hesbah-nonprod` stack, one database per
# environment. No migration step: the API creates its schema and seeds
# reference data on startup (EnsureCreatedAsync + DbSeeder in Program.cs), so
# a fresh preview populates itself.
#
# ── The DNS-alias subtlety ────────────────────────────────────────────────
# Every environment stack attaches to the same `preview-net` so the router can
# reach its web container. Docker adds the SERVICE NAME as an alias on every
# network a container joins — so if the API service were named `api`, then
# `api` would resolve to N different containers on preview-net, and
# frontend/nginx.conf proxies to the literal name `api:8080`. One PR's
# frontend could reach another PR's API.
#
# So the API service is named `backend`, and the name `api` is attached as an
# alias ONLY on this stack's private `default` network. `web` therefore finds
# exactly one `api` — its own — and finds no `api` at all on the shared
# network. The `backend` alias does collide on preview-net, which is harmless:
# nothing on that network ever resolves it.

networks:
  # Private to this environment — where web finds its own api.
  default:
  # Shared with the nonprod stack: reaches preview-db and the router.
  preview-net:
    external: true
    name: preview-net

services:
  # One-shot: create this environment's own database on the shared Postgres.
  #
  # This lives inside the stack rather than being a step CI runs over SSH,
  # because CI can only talk to Portainer — the host accepts no inbound SSH.
  # Keeping provisioning in the stack means a preview needs exactly one API
  # call to exist. `CREATE DATABASE` has no IF NOT EXISTS, hence the
  # SELECT-then-create, which also makes a redeploy of an existing preview
  # (a new push to the PR) a no-op instead of an error.
  provision-db:
    image: postgres:16-alpine
    restart: "no"
    networks:
      - preview-net
    environment:
      PGPASSWORD: ${NONPROD_POSTGRES_PASSWORD:-ChangeMe_DevOnly!}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until pg_isready -h preview-db -U '${NONPROD_POSTGRES_USER:-postgres}' >/dev/null 2>&1; do
          echo "waiting for preview-db…"; sleep 2
        done
        if [ "$$(psql -h preview-db -U '${NONPROD_POSTGRES_USER:-postgres}' -tAc "SELECT 1 FROM pg_database WHERE datname='${ENV_DB_NAME:?}'")" = "1" ]; then
          echo "database ${ENV_DB_NAME} already exists"
        else
          psql -h preview-db -U '${NONPROD_POSTGRES_USER:-postgres}' -c "CREATE DATABASE \"${ENV_DB_NAME:?}\""
          echo "created database ${ENV_DB_NAME}"
        fi

  # Named `backend`, aliased `api` on the private network only — see the
  # header note. Renaming this service to `api` reintroduces cross-PR bleed.
  backend:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    networks:
      default:
        aliases:
          - api
      preview-net:
    environment:
      ConnectionStrings__Default: "Host=preview-db;Port=5432;Database=${ENV_DB_NAME:?};Username=${NONPROD_POSTGRES_USER:-postgres};Password=${NONPROD_POSTGRES_PASSWORD:-ChangeMe_DevOnly!}"
      # Required, with no fallback to docker-compose.yml's value — the one
      # setting where that is impossible. Program.cs refuses to start outside
      # Development if the signing key contains "CHANGE_ME", which is exactly
      # what docker-compose.yml defaults to, so a fallback here would buy a
      # crash loop that only surfaces when the health gate times out.
      #
      # The deploy workflows always supply one: a key DERIVED per environment,
      # so nothing has to be configured and each environment gets its own. A
      # token minted in a preview is worthless against dev or production, and
      # vice versa.
      Jwt__SigningKey: ${ENV_JWT_SIGNING_KEY:?}
      Jwt__Issuer: ${JWT_ISSUER:-GreenMarket}
      Jwt__Audience: ${JWT_AUDIENCE:-GreenMarketClients}
      # web proxies /api to this container, so the browser sees one origin and
      # CORS never applies. Kept for anyone pointing a local frontend here.
      Cors__AllowedOrigins__0: https://${ENV_HOST:?}
      # Production, not Development: Development turns the CORS policy into
      # "allow any origin" and exposes Swagger. Override per environment with
      # ASPNETCORE_ENVIRONMENT=Development on the stack if you want Swagger on
      # a preview.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
    healthcheck:
      # curl is installed in the runtime stage of backend/Dockerfile precisely
      # for this — the aspnet base image ships neither curl nor wget.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      provision-db:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: ${API_MEM:-512m}

  web:
    image: ${WEB_IMAGE:?}
    restart: unless-stopped
    networks:
      - default
      - preview-net
    # No published host port: preview-router reaches this container by NAME
    # over preview-net. That is what lets an arbitrary number of previews
    # coexist without allocating, tracking, or colliding on host ports.
    labels:
      hesbah.environment: ${ENV_ID:?}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128m
