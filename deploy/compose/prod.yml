# Production stack — Portainer stack `hesbah`, served at ${HESBAH_BASE_DOMAIN}.
#
# Two things to know about this file:
#
#   1. Every setting falls back to the value docker-compose.yml uses locally,
#      so the stack comes up with almost nothing configured. The one exception
#      is JWT_SIGNING_KEY — see below.
#   2. Images are pinned by API_IMAGE / WEB_IMAGE — a full reference, never
#      `latest` — so a deploy is reproducible and a rollback is just the
#      previous reference. Both a tag (ghcr.io/…/hesbah-api:aeb680e) and a
#      digest (ghcr.io/…/hesbah-api@sha256:cee32d…) are accepted.
#
# JWT_SIGNING_KEY cannot default. Program.cs refuses to start outside
# Development when the key is shorter than 32 characters or contains
# "CHANGE_ME" — which is precisely what docker-compose.yml falls back to — so
# inheriting that value would produce a crash loop rather than a working
# stack. deploy-prod.yml fails fast with that explanation instead.
#
# ⚠ ChangeMe_DevOnly! IS still the database fallback, and it is published in
#   this repository. A production stack left on it has a password anyone
#   reading the source knows. Set the POSTGRES_PASSWORD secret on the
#   `production` environment; deploy-prod.yml warns on every run until you do.
#
# Every value below comes from the Portainer stack environment, which
# .github/workflows/deploy-prod.yml REPLACES on every deploy from the GitHub
# `production` environment's secrets — so anything typed into Portainer's UI
# by hand survives only until the next merge to main.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Deliberately no `ports:`, unlike docker-compose.yml which publishes 5432
    # for local psql access. Nothing outside this stack's network needs
    # Postgres in production, and publishing it would expose the database to
    # every other host that can reach this one.
    environment:
      POSTGRES_DB: ${DB_NAME:-greenmarket}
      POSTGRES_USER: ${DB_USER:-greenmarket_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe_DevOnly!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-greenmarket_app} -d ${DB_NAME:-greenmarket}"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${DB_NAME:-greenmarket};Username=${DB_USER:-greenmarket_app};Password=${DB_PASSWORD:-ChangeMe_DevOnly!}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?}
      Jwt__Issuer: ${JWT_ISSUER:-GreenMarket}
      Jwt__Audience: ${JWT_AUDIENCE:-GreenMarketClients}
      Cors__AllowedOrigins__0: https://${ENV_HOST:?}
      # Production, not Development: Development turns the CORS policy into
      # "allow any origin" and exposes Swagger. See Program.cs.
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${API_MEM:-768m}

  web:
    image: ${WEB_IMAGE:?}
    restart: unless-stopped
    # Production is NOT behind preview-router: the wildcard *.<base-domain>
    # that feeds the router on 5174 matches subdomains only, not the apex, so
    # the apex gets its own edge vhost pointing straight here.
    #
    # 5175, not the 5173 docker-compose.yml uses locally: 5173 is already
    # published by another project on the target host, and a colliding port
    # fails the stack at container-create time with an error that names the
    # port and nothing else.
    ports:
      - "${WEB_PORT:-5175}:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
