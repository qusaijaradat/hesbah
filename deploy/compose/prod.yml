# Production stack — Portainer stack `hesbah`, served at ${HESBAH_BASE_DOMAIN}.
#
# Two things to know about this file:
#
#   1. Every setting falls back to the value docker-compose.yml uses locally,
#      so the stack comes up with almost nothing configured. The one exception
#      is JWT_SIGNING_KEY — see below.
#   2. Images are pinned by API_IMAGE / WEB_IMAGE — a full reference, never
#      `latest` — so a deploy is reproducible and a rollback is just the
#      previous reference. Both a tag (ghcr.io/…/hesbah-api:aeb680e) and a
#      digest (ghcr.io/…/hesbah-api@sha256:cee32d…) are accepted.
#
# JWT_SIGNING_KEY cannot default. Program.cs refuses to start outside
# Development when the key is shorter than 32 characters or contains
# "CHANGE_ME" — which is precisely what docker-compose.yml falls back to — so
# inheriting that value would produce a crash loop rather than a working
# stack. deploy-prod.yml fails fast with that explanation instead.
#
# ⚠ ChangeMe_DevOnly! IS still the database fallback, and it is published in
#   this repository. A production stack left on it has a password anyone
#   reading the source knows. Set the POSTGRES_PASSWORD secret on the
#   `production` environment; deploy-prod.yml warns on every run until you do.
#
# Every value below comes from the Portainer stack environment, which
# .github/workflows/deploy-prod.yml REPLACES on every deploy from the GitHub
# `production` environment's secrets — so anything typed into Portainer's UI
# by hand survives only until the next merge to main.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Docker's json-file driver has NO size cap by default, so every line this stack
    # has ever logged stays on the disk. On a small VPS that ends one way: the disk
    # fills, Postgres cannot write, and the market stops — with a cause nobody goes
    # looking for, because nothing was wrong with the app. Same three lines on all
    # three services: 30MB each, a few days of history, and a hard ceiling.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Deliberately no `ports:`, unlike docker-compose.yml which publishes 5432
    # for local psql access. Nothing outside this stack's network needs
    # Postgres in production, and publishing it would expose the database to
    # every other host that can reach this one.
    environment:
      POSTGRES_DB: ${DB_NAME:-greenmarket}
      POSTGRES_USER: ${DB_USER:-greenmarket_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe_DevOnly!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-greenmarket_app} -d ${DB_NAME:-greenmarket}"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${DB_NAME:-greenmarket};Username=${DB_USER:-greenmarket_app};Password=${DB_PASSWORD:-ChangeMe_DevOnly!}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?}
      Jwt__Issuer: ${JWT_ISSUER:-GreenMarket}
      Jwt__Audience: ${JWT_AUDIENCE:-GreenMarketClients}
      Cors__AllowedOrigins__0: https://${ENV_HOST:?}
      # Phone notifications. All four are optional and empty is the OFF switch:
      # with no keys the API says so once at startup, the settings screen
      # offers nothing, and every other screen is unaffected. Generate a pair
      # once with `dotnet run --project backend/tools/VapidKeys` and keep it —
      # a new pair does not re-key the phones already subscribed, it orphans
      # them, and every device would have to be turned on again by hand.
      Push__PublicKey: ${VAPID_PUBLIC_KEY:-}
      Push__PrivateKey: ${VAPID_PRIVATE_KEY:-}
      Push__Subject: ${VAPID_SUBJECT:-}
      # The market's clock, not the container's. A container runs on UTC and
      # Palestine is two or three hours ahead, so without this "seven in the
      # morning" arrives at four or five.
      Push__TimeZone: ${PUSH_TIMEZONE:-Asia/Hebron}
      Push__DailyHour: ${PUSH_DAILY_HOUR:-7}
      # Production, not Development: Development turns the CORS policy into
      # "allow any origin" and exposes Swagger. See Program.cs.
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${API_MEM:-768m}

  web:
    image: ${WEB_IMAGE:?}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Production is NOT behind preview-router: the wildcard *.<base-domain>
    # that feeds the router on 5174 matches subdomains only, not the apex, so
    # the apex gets its own edge vhost pointing straight here.
    #
    # 5175, not the 5173 docker-compose.yml uses locally: 5173 is already
    # published by another project on the target host, and a colliding port
    # fails the stack at container-create time with an error that names the
    # port and nothing else.
    ports:
      - "${WEB_PORT:-5175}:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------- nightly pg_dump
  #
  # Until now the only backup this system had was a button somebody had to REMEMBER to press.
  # That is not a backup, it is an intention.
  #
  # A sidecar rather than a cron job on the host, because there is no inbound SSH to this host
  # (deploy/README.md) — everything arrives through Portainer, so anything scheduled has to live
  # inside the stack. It reuses the postgres image that is already pulled, so it costs no extra
  # download and its pg_dump is guaranteed to match the server's version.
  #
  # WHAT THIS DOES AND DOES NOT PROTECT AGAINST, said plainly because the difference matters:
  #   • protects against — a row deleted by mistake, a bad edit, a corrupted table, an app bug
  #     that wrote nonsense. These are the common disasters and this answers all of them.
  #   • does NOT protect against — this VPS dying, or its disk failing. The dumps are ON it.
  #     Somewhere else is the next step and it needs a decision nobody has made yet: where.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PGPASSWORD: ${DB_PASSWORD:-ChangeMe_DevOnly!}
      DB_NAME: ${DB_NAME:-greenmarket}
      DB_USER: ${DB_USER:-greenmarket_app}
      # Local hour to dump at, and how many daily dumps to keep. Two in the morning: the market
      # is asleep and the dump takes a consistent read of a database nobody is writing to.
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - dbbackups:/backups
    depends_on:
      db:
        condition: service_healthy
    # One file per day, named by date, and the day's file existing is what says the day is done.
    # That is the whole scheduler: a restart, a redeploy, or a container that was down at 02:00
    # cannot produce two dumps for one day, and cannot skip a day either — it catches up on the
    # next quarter-hour tick.
    #
    # Written to a temp name and moved into place only on success, because a half-written dump
    # that LOOKS like a backup is worse than no backup at all: it is the one you find out about
    # on the day you need it.
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        set -u
        echo "backup: dumping ${DB_NAME} to /backups daily at ${BACKUP_HOUR}:00, keeping ${BACKUP_KEEP}"
        while true; do
          today=$(date +%F)
          hour=$(date +%H)
          out="/backups/${DB_NAME}-${today}.sql.gz"
          if [ ! -f "${out}" ] && [ "${hour}" -ge "${BACKUP_HOUR}" ]; then
            echo "backup: starting ${today}"
            if pg_dump -h db -U "${DB_USER}" -d "${DB_NAME}" | gzip -c > /backups/.in-progress.gz; then
              mv /backups/.in-progress.gz "${out}"
              echo "backup: wrote ${out}"
              # Newest first, drop everything past the keep count. No xargs -r: busybox is not
              # guaranteed to have it, and an empty list must not delete anything.
              ls -1t /backups/${DB_NAME}-*.sql.gz 2>/dev/null | tail -n +$((BACKUP_KEEP + 1)) | while read -r old; do
                echo "backup: pruning ${old}"
                rm -f "${old}"
              done
            else
              echo "backup: pg_dump FAILED for ${today} — leaving no file, will retry"
              rm -f /backups/.in-progress.gz
            fi
          fi
          sleep 900
        done
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
  # The dumps. A named volume rather than a bind mount, for the same reason as pgdata: nothing
  # on this host's filesystem is this stack's to assume. Read them out through Portainer, or
  # copy them off with `docker cp` from the backup container.
  dbbackups:
