server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unknown path falls back to index.html so React Router
    # (client-side routing) handles it instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
