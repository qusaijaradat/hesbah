server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the "api" upstream through Docker's embedded DNS instead of
    # caching its IP for the life of the worker. Without this, nginx resolves
    # "api" once at startup; when that container is recreated by a redeploy it
    # comes back on a new IP and nginx keeps proxying to the dead one until
    # nginx itself restarts — which shows up as 502s that "fix themselves"
    # only after a second deploy. Holding the upstream in a variable forces
    # per-request resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Single-page app: any unknown path falls back to index.html so React Router
    # (client-side routing) handles it instead of nginx returning a 404.
    #
    # index.html is never cached: it names hashed asset files that change on
    # every build, so a cached copy can point at JS/CSS that no longer exists
    # in the newer image and the user gets a blank page after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed build output (index-[hash].js, …) is safe to cache forever — a new
    # build always produces a new filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy the API so a deployed environment is single-origin: the browser
    # talks only to this host, VITE_API_URL is the relative "/api", and CORS
    # never enters into it. Local `docker compose up` builds the image with an
    # absolute VITE_API_URL and simply doesn't use this location.
    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The edge terminates TLS, so tell the app it is https — otherwise it
        # builds http:// links.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Excel/PDF exports can take a while to render server-side.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 32m;
    }

    # The API's health check, reachable at the public hostname. This has to be
    # its own location: without it the request falls through to the SPA rule
    # above and answers index.html with a 200, which reads as "up" to any
    # health gate even when the API is dead — the deploy would go green on a
    # broken rollout.
    location = /health {
        set $health_upstream api:8080;
        proxy_pass http://$health_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
